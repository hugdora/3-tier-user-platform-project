apiVersion: apps/v1
kind: Deployment

metadata:
  name: mysql
  namespace: qa

spec:
  replicas: 1

  selector:
    matchLabels:
      app: mysql

  template:
    metadata:
      labels:
        app: mysql

    spec:
      serviceAccountName: application

      containers:
        - name: mysql
          image: mysql:8.0

          ports:
            - containerPort: 3306

          env:
            - name: MYSQL_ROOT_PASSWORD_FILE
              value: /mnt/secrets/MYSQL_ROOT_PASSWORD

            - name: MYSQL_DATABASE_FILE
              value: /mnt/secrets/MYSQL_DATABASE

            - name: MYSQL_USER_FILE
              value: /mnt/secrets/MYSQL_USER

            - name: MYSQL_PASSWORD_FILE
              value: /mnt/secrets/MYSQL_PASSWORD

          volumeMounts:
            - name: mysql-data
              mountPath: /var/lib/mysql

            - name: secrets-store
              mountPath: /mnt/secrets
              readOnly: true

          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - mysqladmin ping -h 127.0.0.1 -u"$(cat /mnt/secrets/MYSQL_USER)" -p"$(cat /mnt/secrets/MYSQL_PASSWORD)"
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 10

      volumes:
        - name: mysql-data
          emptyDir: {}

        - name: secrets-store
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: database-secret

---
apiVersion: v1
kind: Service

metadata:
  name: mysql
  namespace: qa

spec:
  selector:
    app: mysql

  ports:
    - port: 3306
      targetPort: 3306

  type: ClusterIP