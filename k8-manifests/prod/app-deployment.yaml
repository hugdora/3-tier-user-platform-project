apiVersion: apps/v1
kind: Deployment

metadata:
  name: nodejs-app
  namespace: prod

spec:
  replicas: 1

  selector:
    matchLabels:
      app: nodejs-app

  template:
    metadata:
      labels:
        app: nodejs-app

    spec:
      serviceAccountName: application

      imagePullSecrets:
        - name: regcred

      containers:
        - name: nodejs-app
          image: hugdora/3-tier-user-platform-project:YOUR_SHA
          ports:
            - containerPort: 5000
          env:
            - name: DB_HOST
              value: mysql

          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3

          volumeMounts:
            - name: secrets-store
              mountPath: /mnt/secrets
              readOnly: true

      volumes:
        - name: secrets-store
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: database-secret